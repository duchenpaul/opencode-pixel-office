name: opencode-pixel-office
version: "1.0.0"
description: "Observe Hermes sessions, tools, subagents and approvals in the shared Pixel Office dashboard."
hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
